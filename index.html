  <style>
    /* Kritisches Splash-CSS inline, mit fest codierten Farben statt CSS-Variablen —
       muss sofort beim ersten Rendern greifen, bevor style.css (extern) geladen ist,
       sonst blitzt kurz nur das unstyled Icon ohne Hintergrund/Layout auf. */
    @font-face {
      font-family: 'Playfair Display';
      src: url('Playfair_Display/PlayfairDisplay-VariableFont_wght.ttf') format('truetype');
      font-weight: 400 900;
      font-style: normal;
      font-display: swap;
    }
    #app-splash {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      height: 100svh;
      height: 100dvh;
      background: #3a7711;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      z-index: 9999;
      opacity: 1;
      transition: opacity 0.4s ease;
    }
    #app-splash.hide {
      opacity: 0;
      pointer-events: none;
    }
    .splash-logo {
      width: 140px;
      height: 140px;
      display: block;
    }
    .splash-wordmark {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: clamp(24px, 7vw, 30px);
      font-weight: 600;
      letter-spacing: 0.28em;
      text-indent: 0.28em;
      color: #fffaeb;
      text-transform: uppercase;
    }
  </style>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
  <link rel="stylesheet" href="style.css?v=20260715x">
  <link rel="stylesheet" href="features.css?v=20261126k">
  <script>
    if (localStorage.getItem('gruenkorb-theme') === 'dark') {
      document.documentElement.setAttribute('data-theme', 'dark');
    }
  </script>
</head>
