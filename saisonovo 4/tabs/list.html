<div class="scroll-area">
      <div class="list-header">
        <h1>Einkaufsliste <span class="list-count-badge" id="list-count"></span></h1>
        <button class="shopping-done-btn" onclick="showShoppingDoneDialog()" aria-label="Einkauf abschließen" id="shopping-done-btn" style="display:none">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" width="22" height="22"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 10.5V6a3.75 3.75 0 1 0-7.5 0v4.5m11.356-1.993 1.263 12c.07.665-.45 1.243-1.119 1.243H4.25a1.125 1.125 0 0 1-1.12-1.243l1.264-12A1.125 1.125 0 0 1 5.513 7.5h12.974c.576 0 1.059.435 1.119 1.007Z" /></svg >
        </button>
      </div>
      <p class="sub" id="list-sub">Deine Liste ist leer</p>
      <button class="recipe-import-btn-prominent" onclick="showRecipeImport()">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" width="18" height="18" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M13.19 8.688a4.5 4.5 0 0 1 1.242 7.244l-4.5 4.5a4.5 4.5 0 0 1-6.364-6.364l1.757-1.757m13.35-.622 1.757-1.757a4.5 4.5 0 0 0-6.364-6.364l-4.5 4.5a4.5 4.5 0 0 0 1.242 7.244" /></svg >
        Rezept per Link importieren
      </button>
      <!-- Scanner (links, 2 Spalten) + Suche/Hinzufügen (rechts, 7 Spalten) – wie im Kochbuch -->
      <div class="g9 list-toprow">
        <button class="list-scan-btn span-2" onclick="scanOpenChooser()" aria-label="Produkt scannen oder Code eingeben">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" width="22" height="22" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M7.5 3.75H6A2.25 2.25 0 0 0 3.75 6v1.5M16.5 3.75H18A2.25 2.25 0 0 1 20.25 6v1.5m0 9V18A2.25 2.25 0 0 1 18 20.25h-1.5m-9 0H6A2.25 2.25 0 0 1 3.75 18v-1.5M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" /></svg >
          <span class="list-scan-lbl">Scannen</span>
        </button>
        <div class="list-add span-7">
          <div class="list-input-wrap">
            <input type="text" id="list-input" placeholder="Lebensmittel hinzufügen …" autocomplete="off" enterkeyhint="done"
              oninput="showAutocomplete(this.value)"
              onkeydown="handleListInputKey(event)"
              onfocus="showAutocomplete(this.value)"
            />
            <div class="autocomplete-dropdown" id="autocomplete-list"></div>
          </div>
        </div>
      </div>

      <div class="card list-empty-message" id="list-empty">
        <div class="list-empty-emoji">🛒</div>
        <p class="list-empty-text">Füge dein erstes Lebensmittel hinzu.<br>Wir warnen dich bei Saison- oder Klima-Themen.</p>
      </div>
      <div class="season-list" id="list-items" style="display:none"></div>
    </div>
